[package]
name = "duopane"
version = "0.5.3"
edition = "2021"
description = "A fast, keyboard-driven dual-pane file manager written in Rust"
license = "MIT"
readme = "README.md"
keywords = ["file-manager", "dual-pane", "commander", "egui"]
categories = ["filesystem", "gui"]
rust-version = "1.95"
default-run = "duopane"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"
trash = "5"
chrono = "0.4"
# Lister (F3): pictures, code colouring, Office text, sound
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "qoi"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Pack / unpack (Alt+F5 / Alt+F9)
tar = "0.4"
flate2 = "1"
# Batch rename: regular-expression find & replace
regex = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
# Lister: Markdown rendered as a formatted page, with its pictures
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "better_syntax_highlighting"] }
egui_extras = { version = "0.37", default-features = false, features = ["file", "image"] }
# Appearance: list and load the fonts installed on the system
fontdb = "0.24"
ignore = "0.4"
kamadak-exif = "0.6"

[target.'cfg(unix)'.dependencies]
# Free space for the drive menu (statvfs); already comes with the other crates.
libc = "0.2"

# Dragging files out of the window into other apps on Wayland (see src/native_drag.rs).
# All three already come with eframe/winit; these lines only let Duopane use them.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
# winit's own defaults (window decorations on GNOME, libwayland loaded at run
# time), which eframe only turns on along with its wgpu renderer.
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
