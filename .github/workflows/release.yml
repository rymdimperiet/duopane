# Builds the Duopane AppImage on GitHub's servers.
#
# - Push a version tag (e.g. `git tag v0.2.0 && git push --tags`) and the AppImage
#   is attached to a GitHub release for that tag.
# - Or run it by hand from the Actions tab; the AppImage is then under the run's
#   "Artifacts".
#
# It builds on Ubuntu 22.04 on purpose: an AppImage runs on systems as new as or
# newer than the one it was built on, so an older base reaches more people.
name: Release AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building only needs to read the code; writing to the release is a job of its
# own, so nothing that runs during the build holds that permission.
permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the sound library headers (needed to build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the AppImage
        run: sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Duopane-AppImage
          path: target/appimage/Duopane-*.AppImage

  publish:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Duopane-AppImage
      - name: Attach it to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Duopane-*.AppImage
